[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-gen"
version = "0.1.0"
description = "漫画自动翻译流水线：日文定位 → OCR → 翻译 → 抹字 → 贴回"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "transformers>=4.53",
    "accelerate",
    "safetensors",
    "opencv-python",
    "pillow>=10",
    "numpy",
    "manga-ocr",
    "simple-lama-inpainting",
    "huggingface_hub",
    "PySide6",
    "easyocr",
    "pymupdf",
    "rarfile",
]

[project.optional-dependencies]
# 本地翻译引擎（Sakura 日译中 + 通用多语言，均为 GGUF，走 llama.cpp；
# Windows CUDA 预编译轮子安装见 README）
local-llm = [
    "llama-cpp-python",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cufft-cu12",
    "nvidia-nvjitlink-cu12",
]
# 离线测试（纯函数、无模型、无网络）
test = [
    "pytest>=7.0",
]

[project.scripts]
comicgen-ui = "comic_gen.ui.app:main"

[tool.setuptools.packages.find]
include = ["comic_gen*"]
