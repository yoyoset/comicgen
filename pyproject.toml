[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-gen"
version = "0.1.0"
description = "漫画自动翻译流水线：日文定位 → OCR → 翻译 → 抹字 → 贴回"
# 只在 3.13 上开发/测试过（见 AGENTS.md 的环境说明），之前 ">=3.10" 是没实测过的
# 猜测范围——审计明确指出这一条，"声称支持但没验证过"和"真的支持"是两回事，
# 改回诚实的范围；哪天真在别的版本上跑通了再放开。
requires-python = ">=3.13,<3.14"
# 直接依赖固定到 requirements-lock.txt 里记录的、当前开发环境实测可用的精确版本
# （15 个里原来只有 transformers/pillow 给了下限，其余 13 个完全不固定，无法复现
# 出问题时"当时到底装的是哪个版本"）。torch/torchvision 故意只锁公开版本号
# （不带 +cu124 本地版本标识）——PEP 440 下 "==2.6.0" 能匹配已装的 "2.6.0+cu124"
# （用 packaging.specifiers 实测验证过），这样 AGENTS.md 里"先装 GPU 版 torch，
# 再 pip install -e ."的两步流程不会被这里的精确匹配打断、误装成纯 CPU 版。
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==5.14.1",
    "accelerate==1.14.0",
    "safetensors==0.8.0",
    "opencv-python==5.0.0.93",
    "pillow==12.2.0",
    "numpy==2.4.4",
    "manga-ocr==0.1.16",
    "simple-lama-inpainting==0.1.0",
    "huggingface_hub==1.24.0",
    "PySide6==6.11.1",
    "easyocr==1.7.2",
    "pymupdf==1.28.0",
    "rarfile==4.3",
]

[project.optional-dependencies]
# 本地翻译引擎（Sakura 日译中 + 通用多语言，均为 GGUF，走 llama.cpp；
# Windows CUDA 预编译轮子安装见 README）。CUDA 运行时 DLL 借用 torch 自带的那一套
# （见 pipeline/_cuda_runtime.py），不再单独装 nvidia-*-cu12 系列 pip 包——
# 这几个包此前也从未真正被 README 的安装步骤用到过（README 装的是 abetlen 预编译的
# cu124 wheel，不依赖它们），是纯粹的死重量。
local-llm = [
    "llama-cpp-python==0.3.34",
]
# 离线测试（纯函数、无模型、无网络）
test = [
    "pytest==9.1.1",
]

[project.scripts]
comicgen-ui = "comic_gen.ui.app:main"
comicgen = "comic_gen.app.job_service:main"

[tool.setuptools.packages.find]
include = ["comic_gen*"]

# ---- 质量门禁（工具本体装在本机 venv，故意不进依赖闭包——见 requirements-lock.txt
#      头注释"重新生成闭包脚本不在库里"，加了会让 lock 对不上声明闭包）----

[tool.ruff]
# 门禁规则只开三类真正抓问题的：F（pyflakes：未用导入/未定义名/重复定义）、
# I（isort：import 分组排序）、E9（语法错误）。刻意不开 E/W 全量——项目注释中文
# 密集，行宽规则会制造海量与质量无关的噪音；不开 BLE001/S110——"捕获 → 翻译成
# 人话"和 best-effort 兜底是全局工程原则明确允许的模式。
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["F", "I", "E9"]

[tool.mypy]
python_version = "3.13"
# 只严格检查 Qt-free 层（core/infra/pipeline/app）。ui/ 依赖 PySide6 的类型存根，
# Qt.ItemIsSelectable 这类枚举访问在存根里被标成不存在，严格检查会满屏与真实运行
# 无关的噪音；且 AGENTS.md 明确本项目没有 UI 测试基础设施，UI 改动用离屏脚本验证。
exclude = ["comic_gen/ui/", "entry_ui.py"]
ignore_missing_imports = true
warn_unused_ignores = true
